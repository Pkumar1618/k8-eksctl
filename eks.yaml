apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: expense-1
  region: us-east-1

managedNodeGroups:
  - name: expense
    instanceType: t3.micro
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    spot: false


